<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LightDAO 浏览器</title>
<style>
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0b0f1c;color:#e8ecf7;line-height:1.6;margin:0;padding:18px 16px 60px}
.wrap{max-width:900px;margin:0 auto}h1{font-size:21px}h2{font-size:15px;margin:22px 0 8px;color:#9fb0dd}
a{color:#8ab4ff;text-decoration:none}header a{margin-right:14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 12px}.stat b{display:block;font-size:17px}.stat span{color:#8a96c4;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid rgba(255,255,255,.08);padding:7px 8px;text-align:left}th{color:#8a96c4;font-size:11.5px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all}
input{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#e8ecf7;padding:10px;font-family:ui-monospace,monospace;font-size:12.5px;margin:6px 0}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#5b8cff,#9b6bff)}
.ok{color:#27d7a0}.err{color:#ff5d73}.mut{color:#8a96c4}
.vbar{display:inline-block;width:70px;height:7px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:6px}.vbar i{display:block;height:100%;background:linear-gradient(90deg,#27d7a0,#5b8cff)}
</style>
<script src="/js/explorer_1.js"></script>
<link rel="stylesheet" href="/theme.css">
<script src="/js/back.js"></script>
</head>
<body>
<div style="max-width:1120px;margin:0 auto;padding:10px 22px;display:flex;gap:16px;font-size:14px"><a href="#" data-back="1" style="color:var(--mut,#9aa3b2);text-decoration:none">← 返回上一页 / Back</a><a href="/" style="color:var(--mut,#9aa3b2);text-decoration:none">⌂ 返回首页 / Home</a><button id="themeT" aria-label="toggle theme" style="margin-left:auto;background:transparent;border:1px solid rgba(128,128,160,.3);border-radius:8px;padding:4px 10px;cursor:pointer;color:inherit">◐</button></div>

<div class="wrap">
<header><a href="/nodes.html">节点</a><a href="/invest.html">子代币</a><a href="/">← 客户端</a><a href="/governance.html">治理</a><a href="/whitepaper.html">白皮书</a></header>
<h1>◈ LightDAO 浏览器 <span class="mut" style="font-size:12px">lightdao-mainnet-1</span></h1>
<div class="grid" id="stats"><div class="stat"><span>加载中…</span></div></div>

<h2>查询</h2>
<input id="q" placeholder="输入 交易hash(大写16进制) 或 地址 wasm1… / wasmvaloper1…">
<button class="btn" id="btnQ">查询</button>
<div id="qres" class="mono" style="margin-top:8px"></div>

<h2>最新区块</h2>
<table><thead><tr><th>高度</th><th>时间(UTC)</th><th>交易数</th><th>提议者</th></tr></thead><tbody id="blocks"></tbody></table>

<h2>验证者</h2>
<table><thead><tr><th>moniker</th><th>状态</th><th>质押(LIGHT)</th><th>佣金</th></tr></thead><tbody id="vals"></tbody></table>
<h2>归属释放 · Vesting（TGE 三段）</h2>
<div class="grid" id="veststats" style="margin-bottom:8px"></div>
<table><thead><tr><th>受益人</th><th>总额(LIGHT)</th><th>已归属</th><th>已领取</th><th>悬崖</th><th>线性</th><th>起始(UTC)</th><th>进度</th></tr></thead><tbody id="vestbody"><tr><td colspan="8" class="mut">加载中…</td></tr></tbody></table>

</div>
<script src="/js/explorer_2.js"></script>
<script src="/js/explorer_3.js"></script>
</body>
</html>
