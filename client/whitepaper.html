<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LightDAO 白皮书 V2.4</title>
<style>
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0b0f1c;color:#e8ecf7;line-height:1.75;margin:0}
.wrap{max-width:860px;margin:0 auto;padding:32px 18px 80px}
header{position:sticky;top:0;background:rgba(11,15,28,.92);backdrop-filter:blur(8px);padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);z-index:5}
header a{color:#8ab4ff;text-decoration:none;margin-right:16px;font-size:14px}
h1{font-size:26px}h2{font-size:21px;margin-top:34px;border-left:4px solid #7c5cff;padding-left:10px}h3{font-size:17px;margin-top:24px}
table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14px}th,td{border:1px solid rgba(255,255,255,.14);padding:7px 10px;text-align:left}th{background:rgba(255,255,255,.06)}
code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:5px;font-size:13px}
pre{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);padding:12px;border-radius:10px;overflow:auto}
blockquote{border-left:3px solid #7c5cff;margin:14px 0;padding:6px 14px;background:rgba(124,92,255,.08);color:#c9d2ee}
#md{white-space:normal}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a href="/">← 返回客户端</a>
  <a href="/explorer.html">浏览器</a>
  <a href="/governance.html">治理</a>
  <a href="/whitepaper.md" download>下载 Markdown</a>
  <a href="https://github.com/youqi023789/lightdao/blob/main/whitepaper/LightDAO_Whitepaper_V2.4.md">GitHub 源</a>
</header>
<div id="md"><p>加载白皮书中…(若长时间无内容,点上方「下载 Markdown」或 GitHub 源)</p></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script>
fetch("/whitepaper.md").then(r=>r.text()).then(t=>{
  if(window.marked){ document.getElementById("md").innerHTML = marked.parse(t); }
  else { document.getElementById("md").innerHTML = "<pre>"+t.replace(/</g,"&lt;")+"</pre>"; }
}).catch(e=>{ document.getElementById("md").innerHTML = "<p>加载失败,请用上方 GitHub 源。</p>"; });
</script>
</body>
</html>
