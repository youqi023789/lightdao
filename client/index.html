<style>
:root{--bg:#070b18;--bg2:#0d1430;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.10);
--tx:#eaf0ff;--mut:#8a96c4;--acc:#5b8cff;--acc2:#9b6bff;--ok:#27d7a0;--warn:#ffb454;--err:#ff5d73;
--grad:linear-gradient(135deg,#5b8cff,#9b6bff 55%,#ff6bd6);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
background:radial-gradient(1200px 700px at 80% -10%,rgba(155,107,255,.20),transparent),radial-gradient(900px 600px at -10% 110%,rgba(91,140,255,.18),transparent),var(--bg);
color:var(--tx);min-height:100vh;line-height:1.5;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.3px}
.dot{width:30px;height:30px;border-radius:9px;background:var(--grad);box-shadow:0 0 18px rgba(123,107,255,.6);display:grid;place-items:center;font-size:15px}
select.lang{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px;appearance:auto;cursor:pointer}
select.lang option{background:#101527;color:#e8ecf7}
select.lang option:checked{background:#1d2742;color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;backdrop-filter:blur(8px)}
.hero{text-align:center;padding:26px 18px;position:relative;overflow:hidden}
.hero h1{font-size:23px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.hero p{color:var(--mut);font-size:13.5px}
.big{font-size:40px;font-weight:800;letter-spacing:-1px;margin:8px 0}
.mini{color:var(--mut);font-size:12px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;transition:.18s;color:#fff;background:var(--grad);box-shadow:0 8px 26px rgba(123,107,255,.34)}
.btn:active{transform:scale(.975)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--tx);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px}.row>*{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:13px;padding:12px}
.stat b{display:block;font-size:19px;margin-top:3px}
.stat span{color:var(--mut);font-size:11.5px}
.bar{height:7px;border-radius:6px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--grad);width:0;transition:width .5s}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.live{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.live.on{background:var(--ok);box-shadow:0 0 0 0 rgba(39,215,160,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(39,215,160,0)}100%{box-shadow:0 0 0 0 rgba(39,215,160,0)}}
.spin{width:120px;height:120px;margin:6px auto 14px;border-radius:50%;background:conic-gradient(from 0deg,#5b8cff,#9b6bff,#ff6bd6,#5b8cff);display:grid;place-items:center;animation:spin 3.4s linear infinite;opacity:.25;transition:opacity .4s;position:relative}
.spin.on{opacity:1;box-shadow:0 0 40px rgba(155,107,255,.45)}
.spin::after{content:"";width:96px;height:96px;border-radius:50%;background:var(--bg2);position:absolute}
.spin b{position:absolute;font-size:13px;color:var(--mut);z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}
.addr{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--mut);word-break:break-all}
textarea,input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:11px;color:var(--tx);padding:11px;font-size:13px;font-family:inherit}
.hide{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#111a36;border:1px solid var(--line);padding:11px 18px;border-radius:12px;font-size:13.5px;opacity:0;transition:.3s;z-index:9;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lnk{color:var(--acc);text-decoration:none;font-size:13px}
footer{text-align:center;color:var(--mut);font-size:11.5px;margin-top:8px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;padding:10px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:600;cursor:pointer;font-size:13.5px}
.tabs button.act{color:#fff;background:linear-gradient(135deg,rgba(91,140,255,.35),rgba(155,107,255,.35));border-color:rgba(155,107,255,.5)}

/* ---- professional polish ---- */
.wrap{max-width:600px}
header{position:sticky;top:0;z-index:6;background:rgba(7,11,24,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 0;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,.06)}
.card{border-radius:20px;padding:20px;border-color:rgba(255,255,255,.08);box-shadow:0 12px 34px rgba(0,0,0,.28)}
.hero{padding:32px 20px}
.hero h1{font-size:26px}
.hero p{font-size:14px}
.big{font-size:46px}
.btn{border-radius:15px;padding:16px;font-size:16.5px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:rgba(255,255,255,.045)}
.btn.ghost:hover{background:rgba(255,255,255,.10)}
.stat{border-radius:15px;padding:14px}
.stat b{font-size:21px}
.seclabel{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:2px 0 8px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row .btn{font-size:14px;padding:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><div class="dot">◈</div>LightDAO</div>
    <select class="lang" id="lang" aria-label="language"></select>
  </header>
  <nav style="display:flex;gap:16px;margin:-4px 0 14px;font-size:13px;flex-wrap:wrap">
    <a class="lnk" href="/explorer.html">浏览器</a>
    <a class="lnk" href="/governance.html">治理</a>
    <a class="lnk" href="/whitepaper.html">白皮书</a>
    <a class="lnk" href="/season.html">Season 1</a>
  </nav>

  <section id="sec-wallet">
    <div class="card hero">
      <h1 data-i="heroT">把闲置设备变成收益</h1>
      <p data-i="heroS">运行轻节点贡献带宽与算力，赚取原生 LIGHT 代币</p>
    </div>
    <div class="card">
      <div class="tabs">
        <button id="tabPk" class="act" data-i="pkTab">Passkey 钱包</button>
        <button id="tabNew" data-i="createW">助记词</button>
        <button id="tabImp" data-i="importW">导入</button>
      </div>
      <div id="panePk">
        <p class="mini" data-i="pkHint" style="margin-bottom:10px"></p>
        <button class="btn" id="btnPkCreate" data-i="pkCreate">创建 Passkey 钱包</button>
        <button class="btn ghost" id="btnPkUnlock" data-i="pkUnlock" style="margin-top:8px">Passkey 解锁</button>
        <button class="btn ghost" id="btnPkSocial" data-i="pkSocial" style="margin-top:8px">社交恢复(分片)</button>
      </div>
      <div id="paneNew" class="hide">
        <p class="mini" data-i="createHint" style="margin-bottom:10px"></p>
        <button class="btn" id="btnCreate" data-i="btnCreate">生成新钱包</button>
      </div>
      <div id="paneImp" class="hide">
        <textarea id="mnem" rows="3" placeholder="12/24 词助记词，空格分隔" style="margin-bottom:10px"></textarea>
        <button class="btn" id="btnImport" data-i="btnImport">导入</button>
      </div>
      <p class="mini" style="margin-top:12px" data-i="warn"></p>
    </div>
  </section>

  <section id="sec-main" class="hide">
    <div class="card hero">
      <div class="spin" id="spin"><b id="spinTx">—</b></div>
      <div class="pill"><span class="live" id="liveDot"></span><span id="statusTx" data-i="idle">未运行</span></div>
      <div class="big" id="estReward">0.0</div>
      <div class="mini" data-i="estLabel">今日预计奖励 (LIGHT)</div>
      <div style="height:14px"></div>
      <button class="btn" id="btnMine" data-i="startMining">开始挖矿</button>
    </div>
    <div class="card">
      <div class="row" style="align-items:center;margin-bottom:12px">
        <div style="flex:1"><div class="mini" data-i="yourAddr">你的地址</div><div class="addr" id="addr"></div></div>
        <button class="btn ghost" id="btnLogout" style="width:auto;padding:9px 14px;font-size:13px" data-i="logout">退出</button>
      </div>
      <div class="grid">
        <div class="stat"><span data-i="balance">余额 (LIGHT)</span><b id="bal">0</b></div>
        <div class="stat"><span data-i="claimable">可领取</span><b id="claimable">0</b></div>
      </div>
      <div style="height:12px"></div>
      <button class="btn ghost" id="btnClaim" data-i="claim">领取奖励</button>
      <div class="seclabel">钱包安全 / Wallet security</div>
      <div class="row">
        <button class="btn ghost" id="btnExportSeed">导出助记词备份</button>
        <button class="btn ghost" id="btnSocialMain">社交恢复(分片)</button>
      </div>
      <a class="btn ghost" href="/governance.html" style="margin-top:8px;display:block;text-align:center;text-decoration:none">治理 · Governance(投票/提案/金库)</a>
    </div>
    <div class="card">
      <div class="mini" data-i="inviteT" style="margin-bottom:8px">邀请好友,赚 TA 首周贡献的 10%</div>
      <div class="row">
        <input id="inviteLink" readonly style="flex:1">
        <button class="btn ghost" id="btnCopyInvite" style="width:auto;padding:9px 14px;font-size:13px" data-i="copy">复制</button>
      </div>
    </div>
    <div class="card">
      <div class="mini" data-i="contrib" style="margin-bottom:10px">实时贡献</div>
      <div class="grid">
        <div class="stat"><span data-i="cBw">带宽</span><b id="mBw">0</b><span>kbps</span><div class="bar"><i id="bBw"></i></div></div>
        <div class="stat"><span data-i="cSess">在线时长</span><b id="mSess">0</b><span>s</span><div class="bar"><i id="bSess"></i></div></div>
        <div class="stat"><span data-i="cVerif">验证任务</span><b id="mVerif">0</b><div class="bar"><i id="bVerif"></i></div></div>
        <div class="stat"><span data-i="cStab">稳定性</span><b id="mStab">0</b><span>%</span><div class="bar"><i id="bStab"></i></div></div>
      </div>
    </div>
    <footer><span data-i="footer"></span> · <a class="lnk" href="https://lightdao.net" target="_blank">lightdao.net</a></footer>
  </section>
</div>
<div class="toast" id="toast"></div>

let LANG=(navigator.language||"zh").toLowerCase(); if(LANG.startsWith("fil")||LANG.startsWith("tl"))LANG="fil"; else LANG=LANG.slice(0,2); if(!I18N[LANG])LANG="en";
const t = k => (I18N[LANG]&&I18N[LANG][k]) || I18N.en[k] || k;
function renderLang(){ document.querySelectorAll("[data-i]").forEach(e=>{const k=e.getAttribute("data-i"); const v=t(k); if(v!==undefined) e.textContent=v;}); document.documentElement.lang=LANG; }
const $=id=>document.getElementById(id);
function toast(m){const el=$("toast");el.textContent=m;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2600);}
async function sha256hex(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}

// 语言下拉(普通脚本, 立即生效)
(function(){ const sel=$("lang"); [["zh","中文"],["en","English"],["es","Español"],["pt","Português"],["id","Bahasa Indonesia"],["vi","Tiếng Việt"],["fil","Filipino"]].forEach(([c,n])=>{const o=document.createElement("option");o.value=c;o.textContent=n;sel.appendChild(o);}); sel.value=LANG; sel.addEventListener("change",()=>{LANG=sel.value;renderLang();}); renderLang(); })();

// 挖矿(真实贡献, 仅用 fetch, 不需 cosmjs)
let mining=false,timer=null,sess=0,hbOk=0,hbTot=0,verif=0,bw=0,myAddr=null;
// 按服务器日持久化当日累计,刷新/重开不丢贡献
let DAYC=0;
function dayKey(){return "ld_day_"+DAYC;}
function saveDayCounters(){ if(!DAYC)return; localStorage.setItem(dayKey(),JSON.stringify({day:DAYC,sess,verif,hbOk,hbTot})); }
async function loadDayCounters(){ try{ const h=await fetch(CFG.gw+"/v1/health").then(r=>r.json()); DAYC=h.current_day||0; }catch(e){ DAYC=0; }
  if(!DAYC)return; const st=JSON.parse(localStorage.getItem(dayKey())||"null"); if(st&&st.day===DAYC){ sess=st.sess||0; verif=st.verif||0; hbOk=st.hbOk||0; hbTot=st.hbTot||0; } else { sess=0;verif=0;hbOk=0;hbTot=0; } updateUI(); }
// 设备指纹(§4.8 反女巫):canvas+WebGL渲染器+UA+屏幕+时区+核心数 哈希;同设备多钱包同指纹→网关去重
let FP="";
async function deviceFP(){ if(FP)return FP; try{
  const c=document.createElement("canvas"); const g=c.getContext("2d");
  g.textBaseline="top"; g.font="14px Arial"; g.fillText("LightDAO fp",2,2);
  g.fillStyle="rgba(100,200,30,.5)"; g.fillRect(0,0,60,20);
  const canvas=c.toDataURL();
  let gl=""; try{ const w=document.createElement("canvas").getContext("webgl"); const dbg=w.getExtension("webgl_debug_renderer_info"); gl=dbg?String(w.getParameter(dbg.UNMASKED_RENDERER_WEBGL)):""; }catch(e){}
  const raw=[canvas.slice(-80),gl,navigator.userAgent,screen.width+"x"+screen.height,screen.colorDepth,Intl.DateTimeFormat().resolvedOptions().timeZone,navigator.hardwareConcurrency||0,navigator.language].join("|");
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(raw));
  FP=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,32);
}catch(e){ FP=""; } return FP; }
async function measureBw(){ let probe=0; try{ const t0=performance.now(); const r=await fetch(CFG.gw+"/v1/probe?_="+Date.now()); const buf=await r.arrayBuffer(); const dt=(performance.now()-t0)/1000; probe=Math.min(Math.round(buf.byteLength*8/1000/Math.max(dt,.001)),100000);}catch(e){} const relay=(window.LDRelay&&window.LDRelay.isStarted())?window.LDRelay.getBandwidthKbps():0; bw=Math.min(Math.max(probe,relay),100000); }
async function doTask(){ const pre=Math.random().toString(36).slice(2)+(myAddr||"x"); for(let n=0;n<300000;n++){ const h=await sha256hex(pre+n); if(h.startsWith("00")){verif++;break;} } }
async function heartbeat(){ hbTot++; const body={miner:myAddr||"wasm1pending00000000000000000000000000000000000000000000000000000",bandwidth_kbps:bw,session_secs:sess,verification_tasks:verif,stability_pct:hbTot?Math.round(hbOk/hbTot*100):100}; const rf=localStorage.getItem("ld_ref"); if(rf)body.referrer=rf; body.fp=await deviceFP(); try{ const r=await fetch(CFG.gw+"/v1/heartbeat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); if(r.ok)hbOk++; }catch(e){} sess+=CFG.heartbeatSec; updateUI(); }
function updateUI(){
  $("mBw").textContent=bw; $("bBw").style.width=Math.min(bw/10000*100,100)+"%";
  $("mSess").textContent=sess; $("bSess").style.width=Math.min(sess/3600*100,100)+"%";
  $("mVerif").textContent=verif; $("bVerif").style.width=Math.min(verif/100*100,100)+"%";
  const stab=hbTot?Math.round(hbOk/hbTot*100):100; $("mStab").textContent=stab; $("bStab").style.width=stab+"%";
  const score=(Math.min(bw,10000)/10000*1e6*40 + Math.min(sess,3600)/3600*1e6*30 + Math.min(verif,100)/100*1e6*20 + stab/100*1e6*10)/100;
  $("estReward").textContent=(score/1e6*650).toLocaleString(undefined,{maximumFractionDigits:1});
  $("spinTx").textContent=stab+"%";
}
function setMiningUI(on){ $("spin").classList.toggle("on",on); $("liveDot").classList.toggle("on",on);
  $("btnMine").textContent=on?t("stopMining"):t("startMining"); $("statusTx").textContent=on?t("running"):t("idle"); }
async function startMining(){ if(mining)return; mining=true; setMiningUI(true); localStorage.setItem("ld_mining","1");
  await loadDayCounters(); if(window.LDRelay)window.LDRelay.start(myAddr); await measureBw(); heartbeat(); doTask(); timer=setInterval(async()=>{await measureBw(); if(Math.random()<.5)doTask(); heartbeat();},CFG.heartbeatSec*1000); }
function stopMining(){ if(!mining)return; mining=false; setMiningUI(false); localStorage.removeItem("ld_mining"); clearInterval(timer); if(window.LDRelay)window.LDRelay.stop(); }
$("btnMine").onclick=()=>{ mining?stopMining():startMining(); };
// 标签切换(Passkey / 助记词 / 导入)
function showTab(w){ ["Pk","New","Imp"].forEach(k=>{ const a=(k===w); const tb=$("tab"+k),pn=$("pane"+k); if(tb)tb.classList.toggle("act",a); if(pn)pn.classList.toggle("hide",!a); }); }
$("tabPk").onclick=()=>showTab("Pk");
$("tabNew").onclick=()=>showTab("New");
$("tabImp").onclick=()=>showTab("Imp");
$("btnLogout").onclick=()=>{stopMining();sessionStorage.removeItem("ld_session");localStorage.removeItem("ld_seed");localStorage.removeItem("ld_mining");location.reload();};
// --- 助记词(回退) ---
$("btnCreate").onclick=async()=>{ if(!window.LD){toast(t("walletFail"));return;} const m=await window.LD.create(); if(m){localStorage.setItem("ld_seed",m); alert(t("saving")+"\n\n"+m); await enter(m); } };
$("btnImport").onclick=async()=>{ if(!window.LD){toast(t("walletFail"));return;} const m=$("mnem").value.trim(); if(!m)return; localStorage.setItem("ld_seed",m); await enter(m); };
// --- Passkey(§4.9 主推) ---
const pkAvail=()=>window.LDPasskey&&window.LDPasskey.isAvailable();
$("btnPkCreate").onclick=async()=>{
  if(!window.LD){toast(t("walletFail"));return;}
  if(!pkAvail()){toast(t("pkUnsupported"));showTab("New");return;}
  if(window.LDPasskey&&window.LDPasskey.hasWallet()&&!confirm("将覆盖当前 Passkey 钱包。若尚未导出助记词备份,旧钱包将永久丢失。确认继续? / Overwrite current Passkey wallet? Export your seed backup first or it is lost forever."))return;
  try{
    const mnem=await window.LD.create();
    let r=await window.LDPasskey.create(mnem,{userLabel:"lightdao-"+Date.now()});
    if(r.needPin){ const pin=prompt(t("pkPinPrompt")); if(!pin||pin.length<6){toast(t("pkFail")+"PIN<6");return;} r=await window.LDPasskey.createWithPin(mnem,r.credId,r.partial.salt,pin); }
    toast(t("pkCreated")); await enter(mnem);
  }catch(e){ toast(t("pkFail")+(e.message||e)); }
};
$("btnPkUnlock").onclick=async()=>{
  if(!pkAvail()){toast(t("pkUnsupported"));showTab("New");return;}
  if(!window.LDPasskey.hasWallet()){toast(t("pkSocialFirst"));return;}
  try{
    let mnem; try{ mnem=await window.LDPasskey.unlock(); }catch(e){ const pin=prompt(t("pkPinPrompt")); mnem=await window.LDPasskey.unlock(pin); }
    toast(t("pkUnlocked")); await enter(mnem);
  }catch(e){ toast(t("pkFail")+(e.message||e)); }
};
$("btnPkSocial").onclick=async()=>{
  if(!pkAvail()){toast(t("pkUnsupported"));return;}
  if(window.LDPasskey.hasWallet()){
    try{
      let pin=null; const rec=JSON.parse(localStorage.getItem("ld_passkey_v1")||"null"); if(rec&&rec.kdf==="pin"){pin=prompt(t("pkPinPrompt"));}
      const shares=await window.LDPasskey.setupSocialRecovery(pin,3,5);
      alert(t("pkSocialHint")+"\n\n"+shares.map((s,i)=>(i+1)+". "+s).join("\n"));
    }catch(e){ toast(t("pkFail")+(e.message||e)); }
  } else {
    const inp=prompt(t("pkRecoverPrompt")); if(!inp)return;
    try{
      const lines=inp.split(/\n+/).map(s=>s.trim()).filter(Boolean);
      const mnem=window.LDPasskey.recoverFromShares(lines);
      await window.LDPasskey.create(mnem,{userLabel:"lightdao-recovered"});
      toast(t("pkRecoverOk")); await enter(mnem);
    }catch(e){ toast(t("pkFail")+(e.message||e)); }
  }
};
$("btnClaim").onclick=async()=>{ if(!window.LD){toast(t("walletFail"));return;} await window.LD.claim(); };
$("btnExportSeed").onclick=async()=>{ if(!window.LDPasskey){toast(t("walletFail"));return;} try{ let m; try{ m=await window.LDPasskey.unlock(); }catch(e1){ const pin=prompt(t("pkPinPrompt")); m=await window.LDPasskey.unlock(pin); } alert("⚠ 你的助记词(唯一离线备份)。请抄写在纸上,切勿截图或发送给任何人:\n\n"+m); }catch(e){ toast(t("pkFail")+(e.message||e)); } };
$("btnSocialMain").onclick=async()=>{ if(!window.LDPasskey||!window.LDPasskey.hasWallet()){toast(t("pkSocialFirst"));return;} try{ let pin=null; const rec=JSON.parse(localStorage.getItem("ld_passkey_v1")||"null"); if(rec&&rec.kdf==="pin"){pin=prompt(t("pkPinPrompt"));} let shares; try{ shares=await window.LDPasskey.setupSocialRecovery(pin,3,5); }catch(e1){ pin=prompt(t("pkPinPrompt")); shares=await window.LDPasskey.setupSocialRecovery(pin,3,5); } alert(t("pkSocialHint")+"\n\n"+shares.map((s,i)=>(i+1)+". "+s).join("\n")); }catch(e){ toast(t("pkFail")+(e.message||e)); } };
async function enter(seed){ const s=seed||localStorage.getItem("ld_seed")||sessionStorage.getItem("ld_session"); if(s && window.LD && await window.LD.connect(s)){ sessionStorage.setItem("ld_session",s); $("addr").textContent=myAddr=window.LD.addr; $("sec-wallet").classList.add("hide"); $("sec-main").classList.remove("hide"); if($("inviteLink"))$("inviteLink").value=location.origin+"/?ref="+myAddr; window.LD.refresh(); if(localStorage.getItem("ld_mining")==="1"){ setTimeout(startMining,400); } } }
// 邀请裂变:读 ?ref= 存 ld_ref;复制邀请链接
(function(){ const q=new URLSearchParams(location.search).get("ref"); if(q&&q.startsWith("wasm1")) localStorage.setItem("ld_ref",q); })();

// 自动登录:助记词老用户自动进;Passkey 需用户手势(生物识别),默认显示 Passkey 标签待解锁
(async()=>{ showTab("Pk"); const sess=sessionStorage.getItem("ld_session"); if(sess){ await enter(sess); return; } const s=localStorage.getItem("ld_seed"); if(s && !(window.LDPasskey&&window.LDPasskey.hasWallet())){ await enter(s); } })();

<script type="module">
const CDN = ["https://cdn.jsdelivr.net/npm/","https://esm.sh/"];
async function loadCosmjs(){
  if(window.__c) return window.__c;
  for(const base of CDN){
    try{
      const url = base==="https://esm.sh/" ? base : base;
      const [cs, ps, sg] = await Promise.all([
        import(base+"@cosmjs/cosmwasm-stargate@0.32.4"+(base==="https://esm.sh/"?"":"/+esm")),
        import(base+"@cosmjs/proto-signing@0.32.4"+(base==="https://esm.sh/"?"":"/+esm")),
        import(base+"@cosmjs/stargate@0.32.4"+(base==="https://esm.sh/"?"":"/+esm")),
      ]);
      window.__c={cs,ps,sg}; return window.__c;
    }catch(e){}
  }
  return null;
}
const PAYMASTER="wasm13c2cjh3fhkesj47tsc5a0vm6pdds39qpcmykhj"; // feegrant granter for gasless first txs
window.LD = null;
(async()=>{
  const c = await loadCosmjs();
  if(!c){ return; } // 优雅降级: 挖矿仍可用, 钱包/领取提示不可用
  const { SigningCosmWasmClient } = c.cs;
  const { DirectSecp256k1HdWallet } = c.ps;
  const { GasPrice } = c.sg;
  let wallet=null, client=null;
  window.LD = {
    addr:null,
    async create(){ const w=await DirectSecp256k1HdWallet.generate(12,{prefix:CFG.prefix}); this._w=w; return w.mnemonic; },
    async connect(seed){ try{ wallet=await DirectSecp256k1HdWallet.fromMnemonic(seed,{prefix:CFG.prefix}); const [a]=await wallet.getAccounts(); this.addr=a.address; client=await SigningCosmWasmClient.connectWithSigner(CFG.rpc,wallet,{gasPrice:GasPrice.fromString("0.0025"+CFG.denom)}); return true; }catch(e){ return false; } },
    async refresh(){ try{ const b=await client.getBalance(this.addr,CFG.denom); document.getElementById("bal").textContent=(Number(b.amount)/1e6).toLocaleString(undefined,{maximumFractionDigits:2}); }catch(e){} },
    async claim(){ try{ const h=await (await fetch(CFG.gw+"/v1/health")).json(); const d=h.current_day-1;
      const p=await fetch(CFG.gw+"/v1/proof?day="+d+"&miner="+this.addr).then(r=>r.ok?r.json():null);
      if(!p){ toast(t("nothing")); return; }
      const msg={claim:{day:d,proof:p.proof,score:{bandwidth:String(p.score.bandwidth),session:String(p.score.session),verification:String(p.score.verification),stability:String(p.score.stability)}}};
      let res; try{ res=await client.execute(this.addr,CFG.miningReward,msg,{amount:[],gas:"300000",granter:PAYMASTER}); }catch(e){ res=await client.execute(this.addr,CFG.miningReward,msg,"auto"); }
      toast(t("claimed")+" "+res.transactionHash.slice(0,10)+"…"); this.refresh();
    }catch(e){ toast(String(e.message||e).slice(0,70)); } },
  };
})();
</script>
