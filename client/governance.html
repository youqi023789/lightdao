<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LightDAO 治理 — Governance</title>
<link rel="stylesheet" href="/css/governance.css">
<script src="/js/governance_1.js?v=17"></script>
<link rel="stylesheet" href="/theme.css">
<script src="/js/back.js?v=17"></script>
<script src="/js/wfix.js?v=17"></script>
</head>
<body>
<div class="u3efb04"><a href="#" data-back="1" class="u59fa2b">← 返回上一页 / Back</a><a href="/" class="u59fa2b">⌂ 返回首页 / Home</a><button id="themeT" aria-label="toggle theme" class="u6b0f12">◐</button></div>

<div class="wrap">
<h1>◈ LightDAO 治理 </h1>
<p class="sub">质押 LIGHT → 投票/发起提案 → 执行。链上治理:质押→提案→投票→执行(governance 合约,自迁移治理)。</p>

<div class="card">
  <h2>钱包</h2>
  <div class="row">
    <button class="btn ghost" id="btnPk">Passkey 解锁</button>
    <button class="btn ghost" id="btnMnem">助记词导入</button>
  </div>
  <input id="mnem" placeholder="12/24 词助记词(点助记词导入后用)" class="ucb4589">
  <div class="mono ud43169" id="addrLine">未连接</div>
  <div class="grid u5371db">
    <div class="stat"><span>LIGHT 余额</span><b id="bal">—</b></div>
    <div class="stat"><span>已质押(治理)</span><b id="staked">—</b></div>
  </div>
  <div class="log" id="log">—</div>
</div>

<div class="card">
  <h2>质押 / 赎回</h2>
  <p class="mut u6b9c17">质押需先授权(light_token → governance),下方一键完成「授权+质押」。发起提案需质押 ≥ <span id="minStake">—</span> LIGHT。</p>
  <div class="row"><input id="stakeAmt" type="number" placeholder="数量(LIGHT)"><button class="btn sm u6b92b8" id="btnStake">质押</button><button class="btn ghost sm u6b92b8" id="btnUnstake">赎回</button></div>
</div>

<div class="card">
  <h2>进行中的提案</h2>
  <div id="props"><span class="mut">加载中…</span></div>
  <button class="btn ghost" id="btnRefresh">刷新提案</button>
</div>

<div class="card">
  <h2>发起提案</h2>
  <select id="ptype"><option value="micro">Micro(通过线55%)</option><option value="acquisition">Acquisition(60%)</option><option value="vc">VC(60%)</option><option value="major">Major(66%)</option><option value="emergency">Emergency(75%,1天)</option></select>
  <input id="ptitle" placeholder="标题">
  <textarea id="pdesc" rows="3" placeholder="描述"></textarea>
  <select id="pkind"><option value="general">通用 DAO 动作(调合约/迁移)</option><option value="investment">投资(铸造子代币)</option></select>
  <div id="kinv" class="ucb4589"><div class="row"><input id="psym" placeholder="子代币符号 e.g. LDCoffee"><input id="pinv" type="number" placeholder="投资额 USD"></div></div>
  <div id="kgen"><input id="ptarget" placeholder="目标合约地址(可选)"><input id="pcall" placeholder="call_msg base64(可选,执行时发给目标)"><input id="pmig" type="number" placeholder="migrate_code_id(可选)"></div>
  <button class="btn" id="btnPropose">发起提案</button>
</div>

<div class="card">
  <h2>金库(treasury_multisig 5/7)</h2>
  <div class="mono" id="treasLine">—</div>
  <button class="btn ghost" id="btnTreas">查询金库</button>
</div>
<p class="sub">← <a href="/" class="u7b53aa">返回主客户端</a></p>
</div>

<script src="/passkey-wallet.js"></script>
<script src="/js/governance_2.js?v=17"></script>
<script src="/js/governance_3.js?v=17"></script>
</body>
</html>
