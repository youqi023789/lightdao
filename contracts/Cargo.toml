[workspace]
resolver = "3"
members = [
  "contracts/light_token",
  "contracts/mining_reward",
  "contracts/governance",
  "contracts/treasury_multisig",
  "contracts/subtoken_factory",
  "contracts/oracle_twap",
  "contracts/anti_fraud",
  "contracts/validator_registry",
  "contracts/vesting",
  "contracts/insurance_fund",
]

[workspace.dependencies]
cosmwasm-std = "2.1.3"
cosmwasm-schema = "2.1.3"
cw-storage-plus = "2.0.0"
cw2 = "2.0.0"
cw20 = "2.0.0"
cw-utils = "2.0.0"
schemars = "0.8.21"
serde = { version = "1.0.210", default-features = false, features = ["derive"] }
thiserror = "1.0.63"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true
